name: Publish Daymark v0.7

on:
  push:
    branches: [daymark-v07-publish]
    paths:
      - '.daymark-source/**'
      - '.github/workflows/publish-daymark-v07.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daymark-calendar-v1
          fetch-depth: 0

      - name: Reconstruct verified v0.7 source
        run: |
          set -euo pipefail
          git fetch origin daymark-v07-publish
          : > /tmp/publish-daymark-v07.sh
          for n in $(seq -w 0 16); do
            git show "origin/daymark-v07-publish:.daymark-source/part-${n}" >> /tmp/publish-daymark-v07.sh
          done
          chmod +x /tmp/publish-daymark-v07.sh
          /tmp/publish-daymark-v07.sh

      - name: Verify release
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m compileall src
          PYTHONPATH=src xvfb-run -a python scripts/check.py

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Daymark Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit \
            -m "feat: publish Daymark Calendar v0.7.0" \
            -m "Why: The verified v0.6.1 audit fixes and UI v2 release were available only as local artifacts while the GitHub branch remained at v0.5." \
            -m "Decision: Apply the complete verified v0.7 source set on top of the existing daymark-calendar-v1 history and publish only after the full Linux GUI test gate passes."
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/daymark-calendar-v1
          git push origin HEAD:refs/heads/v0.7-ui-v2
